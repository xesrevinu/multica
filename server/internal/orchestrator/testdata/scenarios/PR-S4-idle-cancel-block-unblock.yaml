    expect: {tid: none}
  - do: {advance: 2m}
    expect: {tid: T5b_cancel_stuck}
  - expect: {tid: T6_block, status: blocked, assignee: lead, meta: {blocked_reason: "infra attempts exhausted (2/2)"}}
