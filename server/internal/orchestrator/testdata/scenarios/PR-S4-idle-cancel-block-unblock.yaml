  - note: multica flow unblock
    do: {meta: {phase: unblocked}}
    expect: {tid: T7_unblock, status: todo, assignee: a, meta: {attempt_infra: "0"}}
  - do: {run: completed, head: h1, meta: {phase: review_requested, head_sha: h1}}
