        lead_id:
          type: [string, "null"]
        start_date:
          type: [string, "null"]
        due_date:
          type: [string, "null"]
        created_at:
          type: string
        updated_at:
          type: string
        issue_count:
          type: integer
        done_count:
          type: integer
        resource_count:
          type: integer
    ListProjectsResponse:
