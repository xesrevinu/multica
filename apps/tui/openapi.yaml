openapi: 3.1.0
info:
  title: Multica Workspace API
  version: v1
  description: >-
    Read-only subset of the Multica internal workspace API consumed by
    `multica-tui`. Multica does not publish an OpenAPI document for this
    surface; this file is maintained by hand from the Go handlers in
    `server/internal/handler` and the shared TypeScript types in
    `packages/core/types`. Every request carries `Authorization: Bearer <token>`
    and `X-Workspace-ID: <workspace uuid>`; the TUI injects both through the
    HttpClient rather than per-operation parameters. Run `bun run generate`
    after editing this file.
servers:
  - url: https://multica-api.home.internal
    description: Self-hosted API server
security:
  - bearer: []
paths:
  /api/me:
    get:
      operationId: getMe
      summary: Get the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /api/workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces the user belongs to
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Error"
  /api/workspaces/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getWorkspace
      summary: Get a workspace
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Error"
  /api/workspaces/{id}/members:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listMembers
      summary: List workspace members with user identity
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberWithUser"
        default:
          $ref: "#/components/responses/Error"
  /api/issues:
    get:
      operationId: listIssues
      summary: List issues in the active workspace
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: statuses
          in: query
          description: Comma-separated status keys
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: assignee_id
          in: query
          schema:
            type: string
        - name: assignee_types
          in: query
          description: Comma-separated assignee types (member, agent)
          schema:
            type: string
        - name: creator_id
          in: query
          description: Filter to issues created by this user id
          schema:
            type: string
        - name: involves_user_id
          in: query
          description: Issues assigned to the user's agents (excludes direct member assignment)
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
        - name: include_no_project
          in: query
          schema:
            type: boolean
        - name: label_ids
          in: query
          description: Comma-separated label IDs
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
        - name: sort_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListIssuesResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createIssue
      summary: Create an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Created issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        default:
          $ref: "#/components/responses/Error"
  /api/issues/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getIssue
      summary: Get an issue by ID or identifier
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateIssue
      summary: Update an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        default:
          $ref: "#/components/responses/Error"
  /api/issues/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listIssueComments
      summary: List comments on an issue
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createComment
      summary: Create a comment on an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        default:
          $ref: "#/components/responses/Error"
  /api/issues/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listIssueTimeline
      summary: List the merged activity and comment timeline of an issue
      responses:
        "200":
          description: Timeline entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEntry"
        default:
          $ref: "#/components/responses/Error"
  /api/issues/{id}/task-runs:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listIssueTaskRuns
      summary: List agent task runs for an issue
      responses:
        "200":
          description: Task runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentTask"
        default:
          $ref: "#/components/responses/Error"
  /api/issues/{id}/active-task:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getActiveTasksForIssue
      summary: List active agent tasks for an issue
      responses:
        "200":
          description: Active tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveTasksResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/issues/{id}/tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: cancelTask
      summary: Cancel a queued or running task on an issue
      responses:
        "200":
          description: Cancelled task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        default:
          $ref: "#/components/responses/Error"
  /api/issues/{id}/children:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listIssueChildren
      summary: List sub-issues of an issue
      responses:
        "200":
          description: Child issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildIssuesResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/tasks/{taskId}/messages:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: listTaskMessages
      summary: List execution messages for a task
      parameters:
        - name: since
          in: query
          schema:
            type: integer
          description: Return messages with seq greater than this value
      responses:
        "200":
          description: Task messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskMessage"
        default:
          $ref: "#/components/responses/Error"
  /api/issue-statuses:
    get:
      operationId: listIssueStatuses
      summary: List the workspace issue status catalog
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Status catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListIssueStatusesResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/labels:
    get:
      operationId: listLabels
      summary: List workspace labels
      parameters:
        - name: resource_type
          in: query
          schema:
            type: string
            enum: [issue, agent, skill]
      responses:
        "200":
          description: Labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLabelsResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/projects:
    get:
      operationId: listProjects
      summary: List projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProjectsResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getProject
      summary: Get a project
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/projects/{id}/resources:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listProjectResources
      summary: List resources attached to a project
      responses:
        "200":
          description: Project resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProjectResourcesResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/agents:
    get:
      operationId: listAgents
      summary: List agents
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
  /api/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAgent
      summary: Get an agent
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
  /api/agents/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listAgentTasks
      summary: List recent tasks executed by an agent
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentTask"
        default:
          $ref: "#/components/responses/Error"
  /api/agents/{id}/skills:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listAgentSkills
      summary: List skills assigned to an agent
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillSummary"
        default:
          $ref: "#/components/responses/Error"
  /api/runtimes:
    get:
      operationId: listRuntimes
      summary: List daemon-registered agent runtimes
      parameters:
        - name: owner
          in: query
          schema:
            type: string
            enum: [me]
      responses:
        "200":
          description: Runtimes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Runtime"
        default:
          $ref: "#/components/responses/Error"
  /api/skills:
    get:
      operationId: listSkills
      summary: List workspace skills without their SKILL.md bodies
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillSummary"
        default:
          $ref: "#/components/responses/Error"
  /api/skills/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSkill
      summary: Get a skill with file contents
      responses:
        "200":
          description: Skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillWithFiles"
        default:
          $ref: "#/components/responses/Error"
  /api/working-agents:
    get:
      operationId: listWorkingAgents
      summary: List agents with at least one running task
      responses:
        "200":
          description: Working agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkingAgent"
        default:
          $ref: "#/components/responses/Error"
  /api/inbox:
    get:
      operationId: listInbox
      summary: List unread and read inbox items
      responses:
        "200":
          description: Inbox items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxItem"
        default:
          $ref: "#/components/responses/Error"
  /api/inbox/archived:
    get:
      operationId: listArchivedInbox
      summary: List archived inbox items
      responses:
        "200":
          description: Archived inbox items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxItem"
        default:
          $ref: "#/components/responses/Error"
  /api/inbox/unread-count:
    get:
      operationId: getInboxUnreadCount
      summary: Unread inbox count for the current member
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxUnreadCount"
        default:
          $ref: "#/components/responses/Error"
  /api/inbox/mark-all-read:
    post:
      operationId: markAllInboxRead
      summary: Mark all inbox items as read
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"
  /api/inbox/{id}/read:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: markInboxRead
      summary: Mark an inbox item as read
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        default:
          $ref: "#/components/responses/Error"
  /api/inbox/{id}/unread:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: markInboxUnread
      summary: Mark an inbox item as unread
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        default:
          $ref: "#/components/responses/Error"
  /api/inbox/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: archiveInbox
      summary: Archive an inbox item
      responses:
        "200":
          description: Archived item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        default:
          $ref: "#/components/responses/Error"
  /api/inbox/{id}/unarchive:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: unarchiveInbox
      summary: Restore an archived inbox item
      responses:
        "200":
          description: Restored item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        default:
          $ref: "#/components/responses/Error"
  /api/inbox/archive-all:
    post:
      operationId: archiveAllInbox
      summary: Archive every active inbox item
      responses:
        "200":
          description: Count archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxBatchResult"
        default:
          $ref: "#/components/responses/Error"
  /api/inbox/archive-all-read:
    post:
      operationId: archiveAllReadInbox
      summary: Archive all read inbox items
      responses:
        "200":
          description: Count archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxBatchResult"
        default:
          $ref: "#/components/responses/Error"
  /api/inbox/archive-completed:
    post:
      operationId: archiveCompletedInbox
      summary: Archive inbox items whose linked issue is completed
      responses:
        "200":
          description: Count archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxBatchResult"
        default:
          $ref: "#/components/responses/Error"
  /api/chat/sessions:
    get:
      operationId: listChatSessions
      summary: List chat sessions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSession"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createChatSession
      summary: Create a chat session with an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatSessionRequest"
      responses:
        "200":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
        default:
          $ref: "#/components/responses/Error"
  /api/chat/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getChatSession
      summary: Get a chat session
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
        default:
          $ref: "#/components/responses/Error"
  /api/chat/sessions/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listChatMessages
      summary: List messages in a chat session
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: sendChatMessage
      summary: Send a message in a chat session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageRequest"
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendChatMessageResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/chat/sessions/{id}/pin:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: setChatSessionPinned
      summary: Pin or unpin a chat session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetChatSessionPinnedRequest"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
        default:
          $ref: "#/components/responses/Error"
  /api/chat/sessions/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: setChatSessionArchived
      summary: Archive or restore a chat session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetChatSessionArchivedRequest"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
        default:
          $ref: "#/components/responses/Error"
  /api/autopilots:
    get:
      operationId: listAutopilots
      summary: List workspace autopilots
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, archived]
      responses:
        "200":
          description: Autopilots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAutopilotsResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/autopilots/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getAutopilot
      summary: Get an autopilot and its triggers
      responses:
        "200":
          description: Autopilot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAutopilotResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/autopilots/{id}/trigger:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: triggerAutopilot
      summary: Run an autopilot now
      responses:
        "200":
          description: Triggered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"
  /api/autopilots/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listAutopilotRuns
      summary: List recent autopilot runs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAutopilotRunsResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/dashboard/usage/by-agent:
    get:
      operationId: getDashboardUsageByAgent
      summary: Token usage totals by agent
      parameters:
        - name: days
          in: query
          schema:
            type: integer
        - name: project_id
          in: query
          schema:
            type: string
        - name: tz
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Usage rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardUsageByAgent"
        default:
          $ref: "#/components/responses/Error"
  /api/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateComment
      summary: Update a comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteComment
      summary: Delete a comment
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /api/comments/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resolveComment
      summary: Resolve a comment thread
      responses:
        "200":
          description: Resolved comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unresolveComment
      summary: Reopen a resolved comment
      responses:
        "200":
          description: Unresolved comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        default:
          $ref: "#/components/responses/Error"
  /api/issues/{id}/labels:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: attachLabel
      summary: Attach a label to an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachLabelRequest"
      responses:
        "200":
          description: Labels on the issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueLabelsResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/issues/{id}/labels/{labelId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/LabelId"
    delete:
      operationId: detachLabel
      summary: Detach a label from an issue
      responses:
        "200":
          description: Labels on the issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueLabelsResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/orchestrator/issues:
    get:
      operationId: listOrchIssues
      summary: List orchestrator attention issues
      parameters:
        - name: settled_limit
          in: query
          schema:
            type: integer
        - name: project
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Issue-centric orchestrator rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchIssuesResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/orchestrator/issues/{key}/timeline:
    get:
      operationId: getOrchIssueTimeline
      summary: Orchestrator timeline for one issue
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Timeline payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchTimeline"
        default:
          $ref: "#/components/responses/Error"
  /api/orchestrator/flow/{key}/{action}:
    post:
      operationId: orchFlowAction
      summary: Member flow control (accept/reject/unblock/cancel/replay/...)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [accept, reject, unblock, cancel, pause, resume, replay, resolve-conflict]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrchFlowActionRequest"
      responses:
        "200":
          description: Updated flow metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"
  /api/orchestrator/teams:
    get:
      operationId: listOrchTeams
      summary: List orchestrator teams
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchTeamsResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/orchestrator/issues/{key}/pr:
    get:
      operationId: getOrchIssuePR
      summary: Orchestrator PR card for one issue
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: number
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: PR card payload (parsed by shared zod)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"
  /api/orchestrator/issues/{key}/pr/{op}:
    post:
      operationId: orchPROp
      summary: Member PR op (update-branch / rerun-checks / merge / ...)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: op
          in: path
          required: true
          schema:
            type: string
            enum: [update-branch, rerun-checks, merge, sync-labels, delete-branch]
        - name: number
          in: query
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrchPROpRequest"
      responses:
        "200":
          description: Op result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"
  /api/orchestrator/worktrees:
    get:
      operationId: listOrchWorktrees
      summary: List orchestrator worktrees
      parameters:
        - name: issue
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Worktrees payload (parsed by shared zod)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"
  /api/orchestrator/teams/{project}/pause:
    post:
      operationId: pauseOrchTeam
      summary: Pause orchestrator for a project
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrchFlowActionRequest"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"
  /api/orchestrator/teams/{project}/resume:
    post:
      operationId: resumeOrchTeam
      summary: Resume orchestrator for a project
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Error"
  /api/issues/{id}/pull-requests:
    get:
      operationId: listIssuePullRequests
      summary: Linked pull requests for an issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Linked PRs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuePullRequestsResponse"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Personal access token (`mul_...`) or CLI token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    LabelId:
      name: labelId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error envelope written by the server for every non-2xx status
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
    User:
      type: object
      required: [id, name, email, avatar_url, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        avatar_url:
          type: [string, "null"]
        language:
          type: [string, "null"]
        timezone:
          type: [string, "null"]
        profile_description:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    WorkspaceRepo:
      type: object
      required: [url]
      properties:
        url:
          type: string
        description:
          type: string
    Workspace:
      type: object
      required: [id, name, slug, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, "null"]
        context:
          type: [string, "null"]
        repos:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WorkspaceRepo"
        issue_prefix:
          type: string
        avatar_url:
          type: [string, "null"]
        created_at:
          type: string
        updated_at:
          type: string
    MemberWithUser:
      type: object
      required: [id, workspace_id, user_id, role, created_at, name, email]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        user_id:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        created_at:
          type: string
        name:
          type: string
        email:
          type: string
        avatar_url:
          type: [string, "null"]
    Label:
      type: object
      required: [id, workspace_id, name, color, created_at, updated_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        resource_type:
          type: string
        name:
          type: string
        description:
          type: string
        color:
          type: string
        usage_count:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    ListLabelsResponse:
      type: object
      required: [labels, total]
      properties:
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        total:
          type: integer
    IssueStatusCategory:
      type: string
      enum: [backlog, todo, in_progress, in_review, done, blocked, cancelled]
    IssueStatusEntry:
      type: object
      required: [id, workspace_id, key, name, category, color, is_system, position, archived_at, created_at, updated_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/IssueStatusCategory"
        color:
          type: string
        is_system:
          type: boolean
        position:
          type: integer
        archived_at:
          type: [string, "null"]
        created_at:
          type: string
        updated_at:
          type: string
    ListIssueStatusesResponse:
      type: object
      required: [statuses, categories, total]
      properties:
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/IssueStatusEntry"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/IssueStatusCategory"
        total:
          type: integer
    IssuePriority:
      type: string
      enum: [urgent, high, medium, low, none]
    CreateIssueRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
        priority:
          $ref: "#/components/schemas/IssuePriority"
        assignee_type:
          oneOf:
            - $ref: "#/components/schemas/ActorType"
            - type: "null"
        assignee_id:
          type: [string, "null"]
        parent_issue_id:
          type: [string, "null"]
        project_id:
          type: [string, "null"]
        start_date:
          type: [string, "null"]
        due_date:
          type: [string, "null"]
    UpdateIssueRequest:
      type: object
      properties:
        expected_revision:
          type: integer
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
        priority:
          $ref: "#/components/schemas/IssuePriority"
        assignee_type:
          oneOf:
            - $ref: "#/components/schemas/ActorType"
            - type: "null"
        assignee_id:
          type: [string, "null"]
        project_id:
          type: [string, "null"]
        start_date:
          type: [string, "null"]
        due_date:
          type: [string, "null"]
        suppress_run:
          type: boolean
        handoff_note:
          type: string
    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        type:
          type: string
          default: comment
        parent_id:
          type: [string, "null"]
    ActorType:
      type: string
      enum: [member, agent, squad]
    Issue:
      type: object
      required:
        - id
        - workspace_id
        - number
        - identifier
        - title
        - description
        - status
        - priority
        - assignee_type
        - assignee_id
        - creator_type
        - creator_id
        - parent_issue_id
        - project_id
        - position
        - start_date
        - due_date
        - created_at
        - updated_at
      properties:
        id:
          type: string
        workspace_id:
          type: string
        number:
          type: integer
        identifier:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
          description: Status key; one of the 7 built-in categories or a workspace custom key
        status_category:
          $ref: "#/components/schemas/IssueStatusCategory"
        status_name:
          type: string
        priority:
          $ref: "#/components/schemas/IssuePriority"
        assignee_type:
          oneOf:
            - $ref: "#/components/schemas/ActorType"
            - type: "null"
        assignee_id:
          type: [string, "null"]
        creator_type:
          type: string
        creator_id:
          type: string
        parent_issue_id:
          type: [string, "null"]
        project_id:
          type: [string, "null"]
        position:
          type: number
        stage:
          type: [integer, "null"]
        start_date:
          type: [string, "null"]
        due_date:
          type: [string, "null"]
        metadata:
          type: object
          additionalProperties: true
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        created_at:
          type: string
        updated_at:
          type: string
        revision:
          type: integer
        last_activity_at:
          type: [string, "null"]
    ListIssuesResponse:
      type: object
      required: [issues, total]
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        total:
          type: integer
    ChildIssuesResponse:
      type: object
      required: [issues]
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
    Comment:
      type: object
      required: [id, issue_id, author_type, author_id, content, type, parent_id, created_at, updated_at]
      properties:
        id:
          type: string
        issue_id:
          type: string
        author_type:
          type: string
          enum: [member, agent, system]
        author_id:
          type: string
        content:
          type: string
        type:
          type: string
          description: comment, status_change, progress_update, or system
        parent_id:
          type: [string, "null"]
        created_at:
          type: string
        updated_at:
          type: string
        revision:
          type: integer
        resolved_at:
          type: [string, "null"]
        source_task_id:
          type: [string, "null"]
    TimelineEntry:
      type: object
      required: [type, id, actor_type, actor_id, created_at]
      properties:
        type:
          type: string
          enum: [activity, comment]
        id:
          type: string
        actor_type:
          type: string
        actor_id:
          type: string
        actor_name:
          type: string
        created_at:
          type: string
        action:
          type: string
        details:
          type: object
          additionalProperties: true
        content:
          type: string
        parent_id:
          type: [string, "null"]
        updated_at:
          type: string
        comment_type:
          type: string
        resolved_at:
          type: [string, "null"]
        source_task_id:
          type: [string, "null"]
    AgentTaskStatus:
      type: string
      enum: [queued, dispatched, waiting_local_directory, running, completed, failed, cancelled]
    TaskUsage:
      type: object
      required: [model, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens]
      properties:
        provider:
          type: string
        model:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_tokens:
          type: integer
        cache_write_tokens:
          type: integer
        cost_usd_ticks:
          type: integer
    AgentTask:
      type: object
      required: [id, agent_id, runtime_id, issue_id, status, priority, dispatched_at, started_at, completed_at, error, created_at]
      properties:
        id:
          type: string
        agent_id:
          type: string
        runtime_id:
          type: string
        issue_id:
          type: string
          description: Empty string when the task has no linked issue
        status:
          $ref: "#/components/schemas/AgentTaskStatus"
        priority:
          type: integer
        dispatched_at:
          type: [string, "null"]
        started_at:
          type: [string, "null"]
        completed_at:
          type: [string, "null"]
        error:
          type: [string, "null"]
        failure_reason:
          type: string
        created_at:
          type: string
        chat_session_id:
          type: string
        autopilot_run_id:
          type: string
        parent_task_id:
          type: string
        attempt:
          type: integer
        trigger_comment_id:
