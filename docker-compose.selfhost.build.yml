# Development override: package the host-built stage into one image.
# Prefer: make image   (stage + docker build)
# This file remains for `make selfhost-build` callers.
services:
  backend:
    image: multica-backend:local
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
  # Unified image embeds the web UI; no separate frontend build.
  frontend:
    image: multica-backend:local
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
