      - name: code-auditor
        runtime: mac-studio:yielded
        avatar: ./avatars/code-auditor.png
        role: Read-only audit
        description: Looks for broken invariants, wrong behavior, and security risk. Changes no files.
        model: magpie/group/auditor
        thinking_level: medium
        max_concurrent_tasks: 6
        skills:
          - improve-codebase-architecture
          - rust-best-practices
          - apple-appkit
          - webgpu-specs
          - diagnosing-bugs
          - m10-performance
        instructions: |
          Read only. Do not modify files or change git state.

          A finding is a broken invariant, incorrect behavior, or a security risk. A nit, a rename, or a style preference is not a finding unless it hides one of those. Cite the file and the rule or the failing case, and say what would make it go away.

          Post one issue comment, blocking findings first. If you find none, say what you examined. Do not change the issue status or assign anyone.

    projects:
      - title: Holt
        description: >-
          Native UI runtime. Solid, Vue Vapor, or Octane compile to one retained
          tree. Hermes drives a Rust core that records a DrawList. macOS paints
          with Metal and AppKit. The default target is web-gpu. linux-app,
          windows-app, and web-dom have no host.
        status: in_progress
        lead: yielded-lead
        resources:
          - type: local_directory
            local_path: .
            runtime: mac-studio:yielded
            execution_mode: worktree
            label: holt
          - type: github_repo
            url: git@github.com:effect-anything/holt.git
            label: holt
        # In-app orchestrator owns status/assignee for this project (replaces
        # @mention routing). Rendered role text: `multica team preset render`.
        orchestrator:
          auto_start: off
          preset: impl-review-merge
          roles:
            lead: yielded-lead
            reviewer: yielded-reviewer # never in an owner pool
            owners: [heavy-engineer, heavy-engineer-2, heavy-engineer-3, heavy-engineer-4, heavy-engineer-5, heavy-engineer-6]
            human: Ray
            # First matching area label picks the owner pool (after experts).
            routes:
              - {
                  labels:
                    [
                      area:host,
                      area:compiler,
                      area:framework,
                      area:cli,
                      area:apps,
                    ],
                  owners: [heavy-engineer, heavy-engineer-2, heavy-engineer-3, heavy-engineer-4, heavy-engineer-5, heavy-engineer-6],
                }
          experts:
            # gbot is an expert, not an owner: matched before routes, never in the
            # default owner pool, so an unlabelled issue never reaches it.
            - name: deep-work
              agents: [gbot]
              when: { labels: [area:hard, area:cross-cutting] }
              mode: implement
              skills: [holt-checks, diagnosing-bugs]
              instructions: |
                Do the hardest part yourself, or fan out: one herdr pane per independent
                piece, type `grok-pi-worker`, each pane in its own worktree on branch
                `herdr/<task>`. Accept every piece (holt-checks, verify-gates),
                integrate them into this issue's branch (squash, no merge commits, no
                force), close the panes you opened, then hand back as an owner would.
              limits: { concurrent: 1 }
            - name: research
              agents: [gbot]
              when: { labels: [area:research] }
              mode: consult # role baseline skills only; extras exceed the 45000-byte budget
              instructions: |
                Answer from primary sources and the code. One sourced finding: what
                you checked, what you found, what the owner should do. No files, no
                branch.
          repo:
            mode: github
            slug: effect-anything/holt
            hub: /Users/kee/Workspace/boom/holt # wt switch from here; .config/wt.toml hooks run
            main: main
            branch_prefix: agent/
            # GitHub CI stays off (ci.yml is workflow_dispatch only, by decision).
            # The gate is the engine's review-verdict; owners and the reviewer run
            # the local holt checks (holt-checks, verify-gates) before handoff.
            required_checks: [review-verdict]
            disk_path: /Users/kee/.cursor/worktrees
          acceptance:
            labels: [needs-acceptance, needs-GUI-Master, needs-Ray-signoff]
            default_for_labels: [area:apps] # user-visible app behaviour
          limits:
            impl: 6
            review: 6
            infra: 2
            stuck_min: 60 # cold Rust builds are long
            idle_min: 15 # one cargo step can be silent for minutes
            min_free_gb: 40 # every worktree has its own target/
            slots: { cargo: 2 } # Holt 2 + Studio 1 = at most 3 cargo-heavy issues on the Mac Studio

