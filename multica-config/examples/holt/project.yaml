            url: git@github.com:effect-anything/holt.git
            label: holt
        # In-app orchestrator owns status/assignee for this project (replaces
        # @mention routing). Rendered role text: `multica team preset render`.
        orchestrator:
          auto_start: off
          preset: impl-review-merge
          roles:
            lead: yielded-lead
            reviewer: yielded-reviewer # never in an owner pool
            owners: [frontend-engineer, control-plane-engineer]
            human: Ray
            routes:
              - { labels: [area:studio-app], owners: [frontend-engineer] }
              - {
                  labels: [area:control-plane],
                  owners: [control-plane-engineer],
                }
          experts:
            # gbot is an expert, not an owner: matched before routes, never in the
            # default owner pool, so an unlabelled issue never reaches it.
            - name: deep-work
              agents: [gbot]
              when: { labels: [area:hard, area:cross-cutting] }
              mode: implement
              skills: [holt-checks, diagnosing-bugs]
              instructions: |
                Do the hardest part yourself, or fan out: one herdr pane per independent
                piece, type `grok-pi-worker`, each pane in its own worktree on branch
                `herdr/<task>`. Accept every piece (holt-checks, verify-gates),
                integrate them into this issue's branch (squash, no merge commits, no
                force), close the panes you opened, then hand back as an owner would.
              limits: { concurrent: 1 }
            - name: research
              agents: [gbot]
              when: { labels: [area:research] }
              mode: consult # role baseline skills only; extras exceed the 45000-byte budget
              instructions: |
                Answer from primary sources and the code. One sourced finding: what
                you checked, what you found, what the owner should do. No files, no
                branch.
          repo:
            mode: github
            slug: effect-anything/holt
            hub: /Users/kee/Workspace/boom/holt
            main: main
            branch_prefix: agent/
            required_checks: [review-verdict] # GitHub CI off; local holt checks gate
            disk_path: /Users/kee/.cursor/worktrees
          acceptance:
            labels: [needs-acceptance, needs-GUI-Master, needs-Ray-signoff]
            default_for_labels: [area:studio-app] # every studio/app screen change waits for Ray
          limits:
            {
              impl: 3,
              review: 3,
              infra: 2,
              stuck_min: 45,
              idle_min: 12,
              min_free_gb: 40,
              slots: { cargo: 1 },
            }
