{{- $backendImageTag := default .Chart.AppVersion .Values.images.backend.tag -}}
{{- /* `helm upgrade --reuse-values` from a chart without extraCACerts carries no such key. */ -}}
{{- $extraCACerts := (default dict .Values.backend.extraCACerts).configMap -}}
{{- $embeddedFrontend := true -}}
{{- if hasKey .Values.frontend "embedded" -}}
{{- $embeddedFrontend = .Values.frontend.embedded -}}
{{- end -}}
{{- if .Values.backend.uploads.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "multica.backend.fullname" . }}-uploads
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  accessModes:
    {{- toYaml .Values.backend.uploads.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.backend.uploads.persistence.size | quote }}
  {{- with .Values.backend.uploads.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multica.backend.fullname" . }}
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: multica
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ (lookup "v1" "Secret" .Release.Namespace .Values.existingSecret).data | toYaml | sha256sum }}
        {{- if $extraCACerts }}
        checksum/extra-ca-certs: {{ (lookup "v1" "ConfigMap" .Release.Namespace $extraCACerts).data | toYaml | sha256sum }}
        {{- end }}
      labels:
        {{- include "multica.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ $backendImageTag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
            {{- if $embeddedFrontend }}
            - containerPort: 3000
              name: web
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- if or (not .Values.postgres.external.enabled) $extraCACerts $embeddedFrontend }}
          env:
            {{- if not .Values.postgres.external.enabled }}
            - name: DATABASE_URL
              value: {{ include "multica.databaseUrl" . | quote }}
            {{- end }}
            {{- if $embeddedFrontend }}
            - name: FRONTEND_PORT
              value: "3000"
            - name: REMOTE_API_URL
              value: {{ default "http://127.0.0.1:8080" .Values.frontend.config.remoteApiUrl | quote }}
            {{- if .Values.frontend.config.docsUrl }}
            - name: DOCS_URL
              value: {{ .Values.frontend.config.docsUrl | quote }}
            {{- end }}
            {{- if .Values.frontend.config.publicApiUrl }}
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.frontend.config.publicApiUrl | quote }}
            {{- end }}
            {{- if .Values.frontend.config.publicWsUrl }}
            - name: NEXT_PUBLIC_WS_URL
              value: {{ .Values.frontend.config.publicWsUrl | quote }}
            {{- end }}
            {{- end }}
            {{- if $extraCACerts }}
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/multica/ca-certs
            {{- end }}
          {{- end }}
          {{- if or .Values.backend.uploads.persistence.enabled $extraCACerts }}
          volumeMounts:
            {{- if .Values.backend.uploads.persistence.enabled }}
            - name: uploads
              mountPath: /app/data/uploads
            - name: uploads
              mountPath: /app/data/db
              subPath: db
            {{- end }}
            {{- if $extraCACerts }}
            - name: extra-ca-certs
              mountPath: /etc/multica/ca-certs
              readOnly: true
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.backend.uploads.persistence.enabled $extraCACerts }}
      volumes:
        {{- if .Values.backend.uploads.persistence.enabled }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "multica.backend.fullname" . }}-uploads
        {{- end }}
        {{- if $extraCACerts }}
        - name: extra-ca-certs
          configMap:
            name: {{ $extraCACerts }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multica.backend.fullname" . }}
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: multica
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - port: 8080
      targetPort: 8080
      name: http
{{- if .Values.frontend.compatibility.backendAlias }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-alias
spec:
  type: ExternalName
  externalName: {{ printf "%s.%s.svc.cluster.local" (include "multica.backend.fullname" .) .Release.Namespace }}
{{- end }}
